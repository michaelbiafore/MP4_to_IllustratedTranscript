<style>

--text: #1f2933;

--bg: #ffffff;

html { scroll-behavior: smooth; }
body {

color: var(--text);
background: var(--bg);
line-height: 1.65;
max-width: 880px;
margin: 0 auto;
padding: 3rem 1.5rem 6rem;
font-size: 17px;
}
h1 {
font-size: 2.1rem;
line-height: 1.2;
letter-spacing: -0.5px;
border-bottom: 3px solid var(--accent);
padding-bottom: 0.5rem;
margin-bottom: 1rem;
}
h2 {
font-size: 1.5rem;
margin-top: 2.6rem;
padding-top: 1.2rem;
border-top: 1px solid var(--border);

}
h3 {
font-size: 1.18rem;
margin-top: 1.8rem;
color: var(--accent);
}
a { color: var(--accent); text-decoration: none; }

h2#table-of-contents { border-top: none; }
ul { margin: 0.4rem 0; }

}
