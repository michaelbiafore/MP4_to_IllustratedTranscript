[project]
name = "transcript2mdslides"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.2.4",
    # Substack fetching
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "markdownify>=0.12.0",
    # Browser automation for paywalled content
    "playwright>=1.40.0",
    "imageio-ffmpeg>=0.6.0",
    # PDF extraction (for /slidefy-pdf)
    "pymupdf>=1.26.0",
    # Headless transcription (for /MP4+FasterWhisp): Whisper large-v3-turbo via CTranslate2,
    # GPU if available else CPU int8, model auto-downloaded from Hugging Face on first run.
    "faster-whisper>=1.1.0",
    # Frame curation (contact sheets, pHash scene dedup) for the MP4 commands.
    "pillow>=10.0.0",
    "imagehash>=4.3.1",
]
